services:
  postgres-test:
    image: postgres:15-alpine
    container_name: uaeitjobs-postgres-test
    environment:
      POSTGRES_DB: uaeitjobs_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uaeitjobs_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
