spring:
  application:
    name: uaeitjobs
  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/uaeitjobs}}
    username: ${DB_USERNAME:${DATABASE_USER:postgres}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD:secret}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:${PORT:8080}}

app:
  frontend-url: ${APP_FRONTEND_URL:${FRONTEND_DOMAIN:http://localhost:3000}}
  frontend-domain: ${FRONTEND_DOMAIN:http://localhost:3000,http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:uploads}
  ingest:
    adzuna:
      enabled: ${ADZUNA_ENABLED:true}
      app-id: ${ADZUNA_APP_ID:}
      app-key: ${ADZUNA_APP_KEY:}
      pages: ${ADZUNA_PAGES:3}
    # Disabled by default — these sources return remote/global tech jobs,
    # not UAE-located roles. Flip the env var to true if you want to mix
    # remote-worldwide listings back in.
    remoteok:
      enabled: ${REMOTEOK_ENABLED:false}
    himalayas:
      enabled: ${HIMALAYAS_ENABLED:false}
    # JSearch via RapidAPI — UAE-specific Google for Jobs wrapper.
    # Set JSEARCH_RAPIDAPI_KEY in /opt/qten/.env to enable.
    #
    # Free Basic tier = 200 calls/month. Default tier-keywords picks
    # (2+1+0+0) × 4 cron passes/day = 12 calls/day = 360/month — still
    # over the free quota, so on free tier set JSEARCH_TIER1=1 + 1
    # pass/day, OR upgrade to JSearch Pro ($10/mo, 2500 calls).
    jsearch:
      enabled: ${JSEARCH_ENABLED:true}
      rapidapi-key: ${JSEARCH_RAPIDAPI_KEY:}
      country: ${JSEARCH_COUNTRY:ae}
      pages: ${JSEARCH_PAGES:1}
      delay-ms: ${JSEARCH_DELAY_MS:1700}
      tier1-keywords: ${JSEARCH_TIER1:2}
      tier2-keywords: ${JSEARCH_TIER2:1}
      tier3-keywords: ${JSEARCH_TIER3:0}
      tier4-keywords: ${JSEARCH_TIER4:0}
  cron:
    ingest-jobs: ${CRON_INGEST_JOBS:0 0 */6 * * *}
    expire-stale-jobs: ${CRON_EXPIRE_STALE:0 0 2 * * *}
    refresh-active-jobs: ${CRON_REFRESH_ACTIVE:0 15 2 * * *}

  # ── LLM-backed description formatter ────────────────────────────
  # When enabled, every job description routed through the registry's
  # "default" path goes through this LLM to convert flat scraped text
  # into semantic HTML. Any failure (network, timeout, malformed reply)
  # falls back to the heuristic formatter so jobs never get dropped.
  #
  # Providers + currently-supported models (override via LLM_MODEL env var):
  #   openai  → defaults to gpt-4o-mini (Tier 1+ = 500 RPM, $0.0006/posting).
  #             Alternatives: gpt-4o, gpt-4-turbo, gpt-3.5-turbo.
  #   gemini  → defaults to gemini-2.5-flash. Free tier = 5 RPM (set
  #             min-interval-ms=13000 to stay under it). Paid tier = 1500 RPM.
  #             Alternatives: gemini-2.0-flash, gemini-2.5-flash-lite.
  #   claude  → defaults to claude-3-5-haiku-20241022.
  #             Alternatives: claude-3-5-sonnet-20241022, claude-haiku-4-5.
  llm:
    enabled:           ${LLM_ENABLED:false}
    provider:          ${LLM_PROVIDER:openai}
    api-url:           ${LLM_API_URL:}
    api-key:           ${LLM_API_KEY:}
    model:             ${LLM_MODEL:}
    timeout-ms:        ${LLM_TIMEOUT_MS:8000}
    max-input-chars:   ${LLM_MAX_INPUT_CHARS:8000}
    temperature:       ${LLM_TEMPERATURE:0.1}
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:2048}
    # 0 disables throttling. Set to 13000 for Gemini free tier (5 RPM).
    min-interval-ms:   ${LLM_MIN_INTERVAL_MS:0}
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret-change-this-dev-secret}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  email:
    verification-base-url: ${EMAIL_VERIFICATION_URL:http://localhost:3000/verify-email}

sendgrid:
  api-key: ${SENDGRID_API_KEY:}
  from-email: ${SENDGRID_FROM_EMAIL:noreply@uaeitjobs.com}
  from-name: ${SENDGRID_FROM_NAME:UAEITJOBS}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
