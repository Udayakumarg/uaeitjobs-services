# Defaults to in-memory H2 (fast, no Docker needed) for the normal `mvn test`
# run. scripts/run-integration-tests-with-real-db.sh overrides DB_URL/
# DB_USERNAME/DB_PASSWORD to point at the real Postgres container from
# docker-compose.test.yml instead — needed for anything that exercises
# Postgres-only SQL (to_tsvector, ts_rank, string_to_array, etc.), which H2
# doesn't implement even in MODE=PostgreSQL. No driver-class-name here on
# purpose — Spring Boot infers it from the URL scheme either way.
spring.datasource.url=${DB_URL:jdbc:h2:mem:uaeitjobs_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=false

app.jwt.secret=test-secret-test-secret-test-secret-test-secret-test-secret-test-secret
app.encryption.key=test-encryption-secret-do-not-use-in-production
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7
app.frontend-domain=http://localhost:3000
app.frontend-url=http://localhost:3000
app.upload-dir=build/uploads-test
app.email.verification-base-url=http://localhost:3000/verify-email

sendgrid.api-key=
sendgrid.from-email=noreply@uaeitjobs.test
sendgrid.from-name=UAEITJOBS Test
