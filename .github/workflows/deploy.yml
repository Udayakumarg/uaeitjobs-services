name: Build & Deploy — UAEITJobs Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/udayakumarg/uaeitjobs-backend:latest
          # GitHub Actions cache keeps Maven deps warm between runs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/apps/uaeitjobs
            docker compose pull uaeitjobs-backend
            # --force-recreate intermittently races compose's own stop+remove of the
            # old container, failing with "container name already in use" (seen twice
            # in production). Doing it explicitly first is the reliable version of the
            # same operation.
            docker stop uaeitjobs-backend || true
            docker rm uaeitjobs-backend || true
            docker compose up -d --no-deps --no-build uaeitjobs-backend
